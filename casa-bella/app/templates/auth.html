{% extends "base.html" %}
{% block title %}Autentificare{% endblock %}
{% block body %}
<div class="container section">
  <div class="form">
    <h2 style="text-align:center">Bun venit</h2>
    <p style="text-align:center; color:var(--muted); margin-bottom:1.5rem">Loghează-te sau creează un cont nou</p>

    <div class="tabs">
      <button class="active" onclick="show('login')">Login</button>
      <button onclick="show('register')">Înregistrare</button>
    </div>

    <form method="post" id="form-login">
      <input type="hidden" name="mode" value="login">
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Parolă</label><input type="password" name="password" required></div>
      <button class="btn btn-primary" style="width:100%">Loghează-te</button>
      <p style="text-align:center; margin-top:1rem; font-size:.85rem; color:var(--muted)">
        Cont admin demo: <code>admin@casabella.md</code> / <code>admin123</code>
      </p>
    </form>

    <form method="post" id="form-register" style="display:none">
      <input type="hidden" name="mode" value="register">
      <div class="field"><label>Nume complet</label><input type="text" name="full_name" required></div>
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field"><label>Parolă</label><input type="password" name="password" minlength="4" required></div>
      <button class="btn btn-primary" style="width:100%">Creează cont</button>
    </form>
  </div>
</div>

<script>
function show(which){
  document.getElementById('form-login').style.display = which==='login'?'block':'none';
  document.getElementById('form-register').style.display = which==='register'?'block':'none';
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',(i===0)===(which==='login')));
}
</script>
{% endblock %}
